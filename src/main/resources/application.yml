server:
  port: 8080
  servlet:
    context-path: /api
  # Necesario detrás de nginx: respeta X-Forwarded-For / X-Forwarded-Proto
  # para que getRemoteAddr() y los esquemas https se resuelvan correctamente.
  forward-headers-strategy: native

spring:
  application:
    name: medcore

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/health_system_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:imvfbh5cs}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  jackson:
    time-zone: America/Lima

booking:
  lead-time-minutes: ${BOOKING_LEAD_TIME_MINUTES:15}
  time-zone: ${BOOKING_TIME_ZONE:America/Lima}

security:
  jwt:
    # En producción DEBE definirse JWT_SECRET (>= 32 caracteres / 256 bits).
    # El default sólo aplica en desarrollo local.
    secret: ${JWT_SECRET:dev-only-medcore-secret-key-change-me-in-prod-0123456789}
    expiration: 900000
    refresh-expiration: 604800000

---
# Logging SQL verboso sólo en desarrollo local
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
