server:
  port: 8080
  servlet:
    context-path: /api
  forward-headers-strategy: native

spring:
  application:
    name: medcore

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/health_system_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:imvfbh5cs}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  jackson:
    time-zone: America/Lima

booking:
  lead-time-minutes: ${BOOKING_LEAD_TIME_MINUTES:15}
  time-zone: ${BOOKING_TIME_ZONE:America/Lima}

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-medcore-secret-key-change-me-in-prod-0123456789}
    expiration: 900000
    refresh-expiration: 604800000

app:
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:300}
    window-ms: ${RATE_LIMIT_WINDOW_MS:60000}
  auth:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${AUTH_LOCK_MINUTES:15}
    reset-token-minutes: ${AUTH_RESET_TOKEN_MINUTES:30}
    expose-reset-token: ${AUTH_EXPOSE_RESET_TOKEN:false}
  mail:
    from: ${MAIL_FROM:no-reply@medcore.local}
  bootstrap:
    platform-subdomain: ${BOOTSTRAP_PLATFORM_SUBDOMAIN:healthcare}
    platform-name: ${BOOTSTRAP_PLATFORM_NAME:MedCore}
    super-admin-email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
    super-admin-password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: dev

app:
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:6000}
  auth:
    expose-reset-token: ${AUTH_EXPOSE_RESET_TOKEN:true}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}
